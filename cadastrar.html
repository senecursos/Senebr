<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Cadastro - SENE</title>
  <style>
    :root {
      --primary: #003366;
      --primary-dark: #002244;
      --secondary: #28a745;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      margin-top: 10px;
      width: 100%;
    }

    header h1 {
      color: var(--primary);
      font-size: 1.5rem;
    }

    header p {
      color: #666;
      font-size: 0.85rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #218838;
    }

    .status-message {
      display: none;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
      word-break: break-word;
    }

    .status-message.loading {
      display: block;
      background-color: #e9ecef;
      color: #495057;
    }

    .status-message.success {
      display: block;
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      display: block;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>

  <!-- Firebase Web SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsx5AduNRjauY9Ygr98FPzu6dOw89K6LU",
      authDomain: "validacao-certificados-sene.firebaseapp.com",
      projectId: "validacao-certificados-sene",
      storageBucket: "validacao-certificados-sene.firebasestorage.app",
      messagingSenderId: "186766586412",
      appId: "1:186766586412:web:173642cd7d34d7e6a49789"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    async function cadastrarCertificado() {
      const statusDiv = document.getElementById('statusMessage');
      
      const cpfRaw = document.getElementById('cpf').value;
      const aluno = document.getElementById('aluno').value.trim();
      const curso = document.getElementById('curso').value.trim();
      const carga = document.getElementById('carga').value.trim();
      const conclusao = document.getElementById('conclusao').value.trim();
      const codigo = document.getElementById('codigo').value.trim();

      const cpfLimpo = cpfRaw.replace(/\D/g, '');

      if (!cpfLimpo || cpfLimpo.length !== 11) {
        statusDiv.className = 'status-message error';
        statusDiv.textContent = 'Informe um CPF válido com 11 dígitos.';
        return;
      }

      if (!aluno || !curso) {
        statusDiv.className = 'status-message error';
        statusDiv.textContent = 'Preencha pelo menos o Nome e o Curso.';
        return;
      }

      statusDiv.className = 'status-message loading';
      statusDiv.textContent = 'Salvando certificado...';

      try {
        // Autenticação automática em segundo plano para cumprir a regra de segurança
        if (!auth.currentUser) {
          await signInAnonymously(auth);
        }

        await setDoc(doc(db, "certificados", cpfLimpo), {
          aluno: aluno,
          curso: curso,
          carga: carga,
          conclusao: conclusao,
          codigo: codigo
        });

        statusDiv.className = 'status-message success';
        statusDiv.textContent = `Certificado de "${aluno}" cadastrado com sucesso!`;

        // Limpa os campos para o próximo cadastro
        document.getElementById('cpf').value = '';
        document.getElementById('aluno').value = '';
        document.getElementById('cpf').focus();

      } catch (error) {
        console.error("Erro ao cadastrar:", error);
        statusDiv.className = 'status-message error';
        statusDiv.textContent = 'Erro ao salvar no banco de dados. Tente novamente.';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const btnSalvar = document.getElementById('btnSalvar');
      btnSalvar.addEventListener('click', cadastrarCertificado);
    });
  </script>
</head>
<body>

  <header>
    <h1>Cadastro Rápido de Certificados</h1>
    <p>Painel Administrativo SENE</p>
  </header>

  <div class="container">
    <div class="form-group">
      <label for="cpf">CPF do Concludente (Apenas números):</label>
      <input type="text" id="cpf" placeholder="Ex: 60826695337" maxlength="14" autofocus>
    </div>

    <div class="form-group">
      <label for="aluno">Nome Completo do Concludente:</label>
      <input type="text" id="aluno" placeholder="Ex: William Queiroz Alves">
    </div>

    <div class="form-group">
      <label for="curso">Nome do Curso:</label>
      <input type="text" id="curso" placeholder="Ex: Curso Livre para Teste">
    </div>

    <div class="form-group">
      <label for="carga">Carga Horária:</label>
      <input type="text" id="carga" placeholder="Ex: 40h">
    </div>

    <div class="form-group">
      <label for="conclusao">Data de Conclusão:</label>
      <input type="text" id="conclusao" placeholder="Ex: 05/11/2025">
    </div>

    <div class="form-group">
      <label for="codigo">Código da Turma / Registro:</label>
      <input type="text" id="codigo" placeholder="Ex: SENE-2025.turma00">
    </div>

    <button id="btnSalvar">Salvar Certificado</button>

    <div id="statusMessage" class="status-message"></div>
  </div>

</body>
</html>
